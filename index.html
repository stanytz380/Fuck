<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>StanyTz | Premium Auth</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg: #04010a;
            /* Ultra Realistic Glass Variables */
            --glass-bg: rgba(22, 10, 45, 0.15); 
            --glass-blur: blur(40px);
            --glass-border-light: rgba(255, 255, 255, 0.12);
            --glass-border-dark: rgba(0, 0, 0, 0.5);
            --glass-shadow: 0 12px 40px -10px rgba(0, 0, 0, 0.6);
            --glass-inner-light: inset 0 1px 1px rgba(255, 255, 255, 0.15);
            
            --primary: #a855f7;
            --primary-glow: rgba(168, 85, 247, 0.5);
            --success: #10b981;
            --warning: #f59e0b;
            --danger: #ef4444;
            --lifetime: #d946ef;
            --text: #ffffff;
            --text-dim: #a78bfa;
            --font-ui: 'Outfit', sans-serif;
            --font-code: 'JetBrains Mono', monospace;
            --nav-h: 70px;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
        body { background: var(--bg); color: var(--text); font-family: var(--font-ui); min-height: 100vh; overflow-x: hidden; }

        /* Deep Ambient Background Animation */
        body::before {
            content: ""; position: fixed; inset: 0;
            background: radial-gradient(circle at 15% 30%, rgba(168, 85, 247, 0.2) 0%, transparent 50%),
                        radial-gradient(circle at 85% 70%, rgba(14, 165, 233, 0.15) 0%, transparent 50%);
            z-index: -1; animation: pulseBg 15s ease-in-out infinite alternate;
        }
        @keyframes pulseBg { from { opacity: 0.5; transform: scale(1); } to { opacity: 1; transform: scale(1.05); } }

        /* Hyper Realistic Glass Utility */
        .glass { 
            background: var(--glass-bg); 
            backdrop-filter: var(--glass-blur); 
            -webkit-backdrop-filter: var(--glass-blur); 
            border-top: 1px solid var(--glass-border-light);
            border-left: 1px solid var(--glass-border-light);
            border-bottom: 1px solid var(--glass-border-dark);
            border-right: 1px solid var(--glass-border-dark);
            box-shadow: var(--glass-shadow), var(--glass-inner-light);
            border-radius: 20px; 
            position: relative;
            overflow: hidden;
        }

        /* Ambient subtle reflection */
        .glass::after {
            content: ''; position: absolute; top: 0; left: 0; width: 100%; height: 50%;
            background: linear-gradient(to bottom, rgba(255,255,255,0.03) 0%, transparent 100%);
            pointer-events: none;
        }

        /* Sections */
        .view { display: none; padding: 15px 15px calc(var(--nav-h) + 20px) 15px; animation: slideIn 0.4s cubic-bezier(0.2, 0.8, 0.2, 1); }
        .view.active { display: block; }
        @keyframes slideIn { from { opacity: 0; transform: translateY(15px); } to { opacity: 1; transform: translateY(0); } }

        /* Glass Toast Notification */
        #toast { position: fixed; top: 20px; left: 50%; transform: translate(-50%, -20px) scale(0.9); background: rgba(16, 185, 129, 0.6); backdrop-filter: blur(25px); -webkit-backdrop-filter: blur(25px); border-top: 1px solid rgba(255,255,255,0.3); border-left: 1px solid rgba(255,255,255,0.3); color: white; padding: 10px 20px; border-radius: 30px; font-weight: 800; font-size: 0.85rem; opacity: 0; pointer-events: none; transition: all 0.4s cubic-bezier(0.34, 1.56, 0.64, 1); z-index: 1000; box-shadow: 0 8px 30px rgba(0,0,0,0.5); display: flex; align-items: center; gap: 8px; white-space: nowrap;}
        #toast.show { opacity: 1; transform: translate(-50%, 0) scale(1); }

        /* Login Screen */
        #v-login { height: 100vh; display: flex; flex-direction: column; justify-content: center; align-items: center; padding: 30px; text-align: center; }
        .login-logo { font-size: 3.5rem; margin-bottom: 15px; color: var(--primary); filter: drop-shadow(0 0 20px var(--primary-glow)); }
        .db-list { width: 100%; max-width: 400px; margin-top: 25px; display: flex; flex-direction: column; gap: 12px; }
        .db-card { padding: 16px; display: flex; justify-content: space-between; align-items: center; cursor: pointer; transition: 0.2s cubic-bezier(0.34, 1.56, 0.64, 1); }
        .db-card:active { transform: scale(0.95); }

        /* Navbar */
        .navbar { position: fixed; bottom: 0; width: 100%; height: var(--nav-h); background: rgba(4, 1, 10, 0.6); backdrop-filter: blur(40px); -webkit-backdrop-filter: blur(40px); border-top: 1px solid var(--glass-border-light); display: none; justify-content: space-around; align-items: center; z-index: 50; padding-bottom: env(safe-area-inset-bottom); }
        .nav-item { color: rgba(255,255,255,0.3); display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: 0.7rem; font-weight: 700; cursor: pointer; transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1); width: 60px; }
        .nav-item.active { color: var(--primary); transform: translateY(-3px); }
        .nav-item i { font-size: 1.3rem; transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1); }
        .nav-item.active i { transform: scale(1.15); filter: drop-shadow(0 0 10px var(--primary-glow)); }

        /* Header & Dashboard Stats */
        .header-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
        .header-row h2 { font-weight: 800; font-size: 1.5rem; letter-spacing: -0.5px; text-shadow: 0 0 15px rgba(255,255,255,0.1); }
        
        .btn-reload { background: rgba(255,255,255,0.05); border: 1px solid var(--glass-border-light); color: var(--text); padding: 8px 12px; border-radius: 12px; font-size: 1rem; cursor: pointer; transition: 0.3s cubic-bezier(0.34, 1.56, 0.64, 1); backdrop-filter: blur(10px); }
        .btn-reload:active { transform: scale(0.85); background: var(--primary); border-color: var(--primary); }
        
        .stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 15px; }
        .stat-box { padding: 15px 10px; text-align: center; border-radius: 18px; }
        .stat-val { font-size: 1.8rem; font-weight: 800; font-family: var(--font-code); text-shadow: 0 0 15px rgba(255,255,255,0.2); line-height: 1; }
        
        .action-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-bottom: 15px; }
        .act-btn { padding: 12px 5px; font-size: 0.7rem; font-weight: 600; display: flex; flex-direction: column; align-items: center; gap: 6px; cursor: pointer; color: var(--text) !important; border-radius: 16px; transition: 0.2s cubic-bezier(0.34, 1.56, 0.64, 1); }
        .act-btn:active { transform: scale(0.9); }
        .act-btn span { color: var(--text) !important; }
        .act-btn.disabled { opacity: 0.3; pointer-events: none; filter: grayscale(1); }
        .act-btn i { font-size: 1.1rem; color: var(--text-dim); }

        /* Controls */
        .search-row { display: flex; gap: 8px; align-items: center; margin-bottom: 12px; }
        .search-wrap { position: relative; flex: 1; }
        .search-wrap i { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); color: var(--text-dim); font-size: 0.9rem; }
        input, select { width: 100%; padding: 12px 14px; border-radius: 14px; background: rgba(0,0,0,0.3); border-top: 1px solid rgba(255,255,255,0.15); border-left: 1px solid rgba(255,255,255,0.05); border-bottom: 1px solid rgba(0,0,0,0.4); border-right: 1px solid rgba(0,0,0,0.4); color: #fff; font-family: var(--font-ui); font-size: 0.9rem; transition: 0.3s; box-shadow: inset 0 2px 5px rgba(0,0,0,0.3); }
        input[type="date"]::-webkit-calendar-picker-indicator { filter: invert(1); cursor: pointer; opacity: 0.6; }
        input:focus { outline: none; border-top-color: var(--primary); box-shadow: inset 0 2px 5px rgba(0,0,0,0.3), 0 0 15px rgba(168,85,247,0.2); background: rgba(0,0,0,0.5); }
        .search-wrap input { padding-left: 40px; }

        /* SLEEK MODE: Compact Key List */
        .select-all-row { display: flex; align-items: center; gap: 8px; font-size: 0.8rem; font-weight: 700; color: var(--text-dim); margin-bottom: 8px; padding-left: 5px; cursor: pointer; }
        
        .key-card { padding: 12px 14px; display: flex; flex-direction: column; gap: 10px; margin-bottom: 8px; transition: 0.2s; position: relative; border-radius: 18px; animation: popIn 0.3s cubic-bezier(0.34, 1.56, 0.64, 1) backwards; }
        @keyframes popIn { 0% { transform: scale(0.96) translateY(10px); opacity: 0; } 100% { transform: scale(1) translateY(0); opacity: 1; } }
        .key-card.selected { border-top-color: var(--primary); background: rgba(168, 85, 247, 0.1); box-shadow: 0 0 20px rgba(168,85,247,0.15), inset 0 1px 1px rgba(255,255,255,0.1); }
        
        /* Sleek Checkbox */
        .chk { width: 20px; height: 20px; border: 1px solid rgba(255,255,255,0.3); border-top: 1px solid rgba(255,255,255,0.5); border-radius: 6px; display: flex; align-items: center; justify-content: center; cursor: pointer; flex-shrink: 0; transition: 0.2s; background: rgba(0,0,0,0.4); box-shadow: inset 0 2px 4px rgba(0,0,0,0.3); }
        .chk.active { background: var(--primary); border-color: var(--primary); box-shadow: 0 0 10px var(--primary-glow); }
        .chk i { font-size: 0.65rem; color: white; transform: scale(0); transition: 0.2s cubic-bezier(0.34, 1.56, 0.64, 1); }
        .chk.active i { transform: scale(1); }

        /* Sleek Row Layout */
        .key-card-top { display: flex; align-items: center; gap: 10px; width: 100%; }
        .key-info-name { flex: 1; min-width: 0; display: flex; align-items: center; gap: 6px; }
        
        .key-name { font-family: var(--font-code); font-weight: 700; font-size: 0.95rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; cursor: pointer; color: #fff; text-shadow: 0 0 5px rgba(255,255,255,0.2); }
        
        .badge { padding: 3px 8px; border-radius: 6px; font-size: 0.6rem; font-weight: 800; text-transform: uppercase; letter-spacing: 0.5px; box-shadow: 0 2px 8px rgba(0,0,0,0.3); white-space: nowrap; }
        .b-act { background: rgba(16, 185, 129, 0.15); color: var(--success); border: 1px solid rgba(16, 185, 129, 0.3); }
        .b-un { background: rgba(245, 158, 11, 0.15); color: var(--warning); border: 1px solid rgba(245, 158, 11, 0.3); }
        .b-exp { background: rgba(239, 68, 68, 0.15); color: var(--danger); border: 1px solid rgba(239, 68, 68, 0.3); }
        .b-life { background: rgba(217, 70, 239, 0.15); color: var(--lifetime); border: 1px solid rgba(217, 70, 239, 0.3); }

        .key-card-bottom { display: flex; justify-content: space-between; align-items: center; padding-left: 30px; }
        .key-meta { font-size: 0.75rem; color: var(--text-dim); display: flex; flex-direction: column; gap: 2px; }
        .key-meta span { display: flex; align-items: center; gap: 5px; }
        .key-meta i { font-size: 0.7rem; opacity: 0.7; width: 12px; text-align: center; }

        .key-actions { display: flex; align-items: center; gap: 6px; }
        .k-btn { background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.08); border-radius: 8px; color: var(--text-dim); cursor: pointer; width: 28px; height: 28px; display: flex; justify-content: center; align-items: center; transition: 0.2s cubic-bezier(0.34, 1.56, 0.64, 1); backdrop-filter: blur(5px); }
        .k-btn:active { transform: scale(0.85); }
        .k-btn:hover { background: rgba(255,255,255,0.1); color: var(--primary); border-color: rgba(255,255,255,0.2); }
        .k-btn.k-del:hover { color: var(--danger); border-color: rgba(239, 68, 68, 0.3); }
        .k-btn.k-warn:hover { color: var(--warning); border-color: rgba(245, 158, 11, 0.3); }

        /* Device Logs */
        .log-item { padding: 12px 14px; margin-bottom: 10px; border-radius: 16px; border-left: 3px solid var(--primary); display: flex; flex-direction: column; gap: 4px; }
        .log-time { font-family: var(--font-code); color: var(--text-dim); font-size: 0.7rem; }
        .log-model { font-weight: 800; font-size: 0.95rem; text-shadow: 0 0 10px rgba(255,255,255,0.1); }
        .log-status { font-size: 0.7rem; padding: 4px 8px; border-radius: 6px; display: inline-block; background: rgba(0,0,0,0.5); border: 1px solid rgba(255,255,255,0.05); width: fit-content; margin-top: 2px;}

        /* Ultra Realistic Modals */
        .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.7); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); display: none; align-items: center; justify-content: center; padding: 15px; z-index: 100; transition: opacity 0.3s; opacity: 0; }
        .modal-overlay.active { display: flex; opacity: 1; }
        .modal-panel { width: 100%; max-width: 380px; background: rgba(15, 8, 30, 0.6); border-top: 1px solid rgba(255,255,255,0.2); border-left: 1px solid rgba(255,255,255,0.1); border-bottom: 1px solid rgba(0,0,0,0.6); border-right: 1px solid rgba(0,0,0,0.6); box-shadow: 0 25px 60px rgba(0,0,0,0.8), inset 0 1px 2px rgba(255,255,255,0.15); border-radius: 24px; padding: 20px; transform: scale(0.9); transition: 0.4s cubic-bezier(0.34, 1.56, 0.64, 1); backdrop-filter: blur(40px); -webkit-backdrop-filter: blur(40px); }
        .modal-overlay.active .modal-panel { transform: scale(1); }
        .modal-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
        .modal-head h2 { font-weight: 800; font-size: 1.3rem; text-shadow: 0 0 15px rgba(255,255,255,0.2); }
        .modal-head i { cursor: pointer; padding: 6px; background: rgba(255,255,255,0.05); border-radius: 50%; font-size: 1rem; transition: 0.2s; border: 1px solid transparent; }
        .modal-head i:active { transform: scale(0.8); background: rgba(239, 68, 68, 0.15); color: var(--danger); border-color: rgba(239, 68, 68, 0.3); }
        
        .btn { padding: 14px; border-radius: 16px; border: none; font-weight: 800; font-size: 1rem; cursor: pointer; width: 100%; font-family: var(--font-ui); transition: 0.2s cubic-bezier(0.34, 1.56, 0.64, 1); text-shadow: 0 1px 2px rgba(0,0,0,0.3); }
        .btn-p { background: linear-gradient(135deg, #b46cf8, #7e22ce); color: white; box-shadow: 0 8px 20px rgba(168, 85, 247, 0.3), inset 0 1px 1px rgba(255,255,255,0.3); border-top: 1px solid rgba(255,255,255,0.4); }
        .btn-p:active { transform: scale(0.96); box-shadow: 0 2px 10px rgba(168, 85, 247, 0.4); }

        .checkbox-row { display: flex; align-items: center; gap: 10px; margin-top: 10px; margin-bottom: 5px; cursor: pointer; padding: 10px; background: rgba(0,0,0,0.3); border-radius: 12px; border: 1px solid rgba(255,255,255,0.05); font-size: 0.85rem; box-shadow: inset 0 2px 4px rgba(0,0,0,0.2); }
        .checkbox-row input[type="checkbox"] { width: 18px; height: 18px; accent-color: var(--primary); cursor: pointer; }

        @media (min-width: 768px) {
            .app-container { max-width: 450px; margin: 0 auto; }
        }
        
        /* Floating animation */
@keyframes float {
    0% { transform: translateY(0px); }
    50% { transform: translateY(-8px); }
    100% { transform: translateY(0px); }
}

.floating {
    animation: float 4s ease-in-out infinite;
}

.floating-delay {
    animation: float 4s ease-in-out infinite 0.5s;
}

.floating-delay-2 {
    animation: float 4s ease-in-out infinite 1s;
}
    </style>
</head>
<body>

    <div id="toast"><i class="fas fa-bell"></i> <span id="toast-msg">Notification</span></div>

    <div id="v-login" class="view active">
        <div class="login-logo floating"><i class="fas fa-fingerprint"></i></div>
        <h1 style="font-weight: 800; text-shadow: 0 0 25px var(--primary-glow); font-size: 2.5rem; letter-spacing: -1px;" class="floating-delay">Login Engine</h1>
        <p style="color: var(--text-dim); font-size: 0.9rem; margin-top: 5px;" class="floating-delay-2">Admin Panel Ultra</p>
        <div class="db-list" id="db-list"></div>
        <button class="btn glass" style="margin-top: 25px; border-style: dashed; border-color: var(--primary); box-shadow: none; color: white;" onclick="openModal('m-add-db')">
    <i class="fas fa-plus"></i> Add Database
</button>
    </div>

    <div class="app-container" id="main-app" style="display:none;">
        
        <div id="v-home" class="view active">
            <div class="header-row">
                <h2>System <span style="color: var(--primary);">Overview</span></h2>
                <button class="btn-reload glass" id="btn-reload" onclick="manualReload()" title="Sync">
                    <i class="fas fa-sync-alt" id="reload-icon"></i>
                </button>
            </div>
            
            <div class="stats-grid">
                <div class="glass stat-box">
                    <div class="stat-val" id="st-total">0</div>
                    <div style="font-size: 0.65rem; color: var(--text-dim); text-transform: uppercase; font-weight: 800; margin-top: 4px; letter-spacing: 0.5px;">Total Keys</div>
                </div>
                <div class="glass stat-box">
                    <div class="stat-val" id="st-live" style="color: var(--success)">0</div>
                    <div style="font-size: 0.65rem; color: var(--text-dim); text-transform: uppercase; font-weight: 800; margin-top: 4px; letter-spacing: 0.5px;">Logged In</div>
                </div>
            </div>

            <div class="action-grid">
                <div class="glass act-btn" onclick="openSingleModal()"><i class="fas fa-plus"></i> Single</div>
                <div class="glass act-btn" onclick="openModal('m-bulk-gen')"><i class="fas fa-layer-group"></i> Bulk</div>
                <div class="glass act-btn disabled" id="btn-edit" onclick="openBulkEdit()"><i class="fas fa-pen"></i> Edit (<span id="count-e">0</span>)</div>
                <div class="glass act-btn disabled" id="btn-del" onclick="deleteSelected()"><i class="fas fa-trash" style="color:var(--danger)"></i>Del<span id="count-d"></span></div>
            </div>

            <div class="search-row">
                <div class="search-wrap">
                    <i class="fas fa-search"></i>
                    <input type="text" id="search" placeholder="Filter keys..." oninput="renderKeys()">
                </div>
                <select id="filter-type" style="width: auto;" onchange="renderKeys()">
                    <option value="all">All</option>
                    <option value="active">Active</option>
                    <option value="unused">Unused</option>
                    <option value="expired">Expired</option>
                    <option value="lifetime">Lifetime</option>
                </select>
            </div>

            <div class="select-all-row" onclick="toggleSelectAll()">
                <div class="chk" id="chk-all"><i class="fas fa-check"></i></div>
                <span>Select All</span>
            </div>

            <div id="key-list"></div>
        </div>

        <div id="v-logs" class="view">
            <div class="header-row">
                <h2>Device <span style="color: var(--primary);">Logs</span></h2>
                <button class="btn-reload glass" onclick="manualReload()"><i class="fas fa-sync-alt"></i></button>
            </div>
            <div id="log-list"></div>
        </div>

        <div id="v-conf" class="view">
            <h2 style="margin-bottom: 20px; font-weight: 800; text-shadow: 0 0 15px rgba(255,255,255,0.1);">Dialog <span style="color: var(--primary);">Config</span></h2>
            <div class="glass" style="padding: 20px;">
                <div style="margin-bottom: 15px;">
                    <label style="font-size: 0.8rem; color: var(--text-dim); font-weight: 800; margin-left: 4px;">Dialog Title</label>
                    <input type="text" id="cfg-title" style="margin-top: 6px;" placeholder="e.g. Monster">
                </div>
                <div style="margin-bottom: 15px;">
                    <label style="font-size: 0.8rem; color: var(--text-dim); font-weight: 800; margin-left: 4px;">Dialog Subtitle</label>
                    <input type="text" id="cfg-subtitle" style="margin-top: 6px;" placeholder="e.g. Engine">
                </div>
                <div style="margin-bottom: 20px;">
                    <label style="font-size: 0.8rem; color: var(--text-dim); font-weight: 800; margin-left: 4px;">Admin URL</label>
                    <input type="text" id="cfg-url" style="margin-top: 6px;" placeholder="https://t.me/wolftz">
                </div>
                <button class="btn btn-p" onclick="saveConfig()">Save Settings</button>
                <button class="btn glass" style="margin-top: 12px; border-color: rgba(239, 68, 68, 0.3); color: var(--danger);" onclick="location.reload()">Disconnect Session</button>
            </div>
        </div>

    </div>

    <div class="navbar" id="navbar">
        <div class="nav-item active" onclick="nav('home', this)"><i class="fas fa-home"></i>Home</div>
        <div class="nav-item" onclick="nav('logs', this)"><i class="fas fa-mobile-alt"></i>Devices</div>
        <div class="nav-item" onclick="nav('conf', this)"><i class="fas fa-cog"></i>Config</div>
    </div>

    <div class="modal-overlay" id="m-add-db">
        <div class="modal-panel">
            <div class="modal-head"><h2>Add Database</h2><i class="fas fa-times" onclick="closeModal('m-add-db')"></i></div>
            <input type="text" id="db-nick" placeholder="Nickname (e.g. Auth)" style="margin-bottom: 12px;">
            <input type="text" id="db-url" placeholder="https://firebaseio.com">
            <button class="btn btn-p" style="margin-top: 20px;" onclick="addDatabase()">Connect</button>
        </div>
    </div>

    <div class="modal-overlay" id="m-bulk-gen">
        <div class="modal-panel">
            <div class="modal-head"><h2>Bulk Generate</h2><i class="fas fa-times" onclick="closeModal('m-bulk-gen')"></i></div>
            <div style="display: flex; gap: 10px; margin-bottom: 15px;">
                <input type="number" id="mb-amt" value="10" placeholder="Amt">
                <input type="text" id="mb-pre" value="STANY-VIP-" placeholder="Prefix">
            </div>
            <label style="font-size: 0.8rem; color: var(--text-dim); font-weight: 800; margin-left: 4px;">Expiry Date</label>
            <input type="date" id="mb-date" style="margin-top: 6px;">
            <label class="checkbox-row">
                <input type="checkbox" id="mb-life" onchange="toggleDateInput('mb-date', this.checked)"> Lifetime Access
            </label>
            <button class="btn btn-p" style="margin-top: 20px;" onclick="generateBulk()">Generate Keys</button>
        </div>
    </div>

    <div class="modal-overlay" id="m-single-gen">
        <div class="modal-panel">
            <div class="modal-head"><h2>Add Single Key</h2><i class="fas fa-times" onclick="closeModal('m-single-gen')"></i></div>
            <input type="text" id="ms-key" placeholder="Key Name" style="margin-bottom: 15px;">
            <label style="font-size: 0.8rem; color: var(--text-dim); font-weight: 800; margin-left: 4px;">Expiry Date</label>
            <input type="date" id="ms-date" style="margin-top: 6px;">
            <label class="checkbox-row">
                <input type="checkbox" id="ms-life" onchange="toggleDateInput('ms-date', this.checked)"> Lifetime Access
            </label>
            <button class="btn btn-p" style="margin-top: 20px;" onclick="generateSingle()">Create Key</button>
        </div>
    </div>

    <div class="modal-overlay" id="m-edit-key">
        <div class="modal-panel">
            <div class="modal-head"><h2>Edit Key(s)</h2><i class="fas fa-times" onclick="closeModal('m-edit-key')"></i></div>
            <p id="edit-target-text" style="color: var(--text-dim); font-size: 0.8rem; margin-bottom: 15px; padding: 8px 12px; background: rgba(0,0,0,0.3); border-radius: 10px; border: 1px solid rgba(255,255,255,0.05);"></p>
            
            <div id="edit-hwid-container">
                <label style="font-size: 0.8rem; color: var(--text-dim); font-weight: 800; margin-left: 4px;">Bound Device (HWID)</label>
                <input type="text" id="me-hwid" style="margin-top: 6px; margin-bottom: 15px; font-family: var(--font-code); font-size: 0.8rem;" placeholder="Leave blank to unbind">
            </div>

            <label style="font-size: 0.8rem; color: var(--text-dim); font-weight: 800; margin-left: 4px;">New Expiry Date</label>
            <input type="date" id="me-date" style="margin-top: 6px;">
            <label class="checkbox-row">
                <input type="checkbox" id="me-life" onchange="toggleDateInput('me-date', this.checked)"> Lifetime Access
            </label>
            <button class="btn btn-p" style="margin-top: 20px;" onclick="saveEdit()">Save Changes</button>
        </div>
    </div>

    <script>
        let DB = { dialog_config: {}, keys: {}, logs: { devices: {} } };
        let SERVERS = JSON.parse(localStorage.getItem('dynamos_servers') || "[]");
        let CURRENT_URL = "";
        let SELECTED = new Set();
        let EDIT_TARGET = null;
        let autoSyncInterval;

        window.onload = () => { renderServerList(); };

        function toggleDateInput(id, isChecked) {
            document.getElementById(id).disabled = isChecked;
            if(isChecked) document.getElementById(id).style.opacity = '0.3';
            else document.getElementById(id).style.opacity = '1';
        }

        function formatDateToJSON(dateString) {
            if(!dateString) return "";
            const [y, m, d] = dateString.split('-');
            return `${d}/${m}/${y}`;
        }
        
        function formatDateToPicker(dateString) {
            if(!dateString || dateString === 'lifetime') return "";
            const parts = dateString.split('/');
            if(parts.length === 3) return `${parts[2]}-${parts[1]}-${parts[0]}`;
            return "";
        }

        function checkStatus(expiry, hwid) {
            if (expiry.toLowerCase() === 'lifetime') return 'lifetime';
            if (!expiry) return 'unused';
            
            const parts = expiry.split('/');
            if (parts.length === 3) {
                const expDate = new Date(`${parts[2]}-${parts[1]}-${parts[0]}T23:59:59`);
                if (expDate < new Date()) return 'expired';
            }
            return hwid ? 'active' : 'unused';
        }

        function renderServerList() {
            const list = document.getElementById('db-list');
            list.innerHTML = '';
            SERVERS.forEach((s) => {
                const div = document.createElement('div');
                div.className = 'glass db-card';
                div.onclick = () => connect(s.url);
                div.innerHTML = `<div><b style="font-size: 1rem;">${s.nick}</b><br><small style="color:var(--text-dim); font-size: 0.7rem;">${s.url.substring(0,25)}...</small></div><i class="fas fa-chevron-right" style="color:var(--primary); background: rgba(168, 85, 247, 0.1); padding: 8px; border-radius: 50%; font-size: 0.9rem;"></i>`;
                list.appendChild(div);
            });
        }

        function addDatabase() {
            const nick = document.getElementById('db-nick').value || "WolfTz Auth";
            let url = document.getElementById('db-url').value.trim();
            if(!url) return;
            if(!url.startsWith('http')) url = 'https://' + url;
            if(url.endsWith('/')) url = url.slice(0, -1);
            
            SERVERS.push({ nick, url });
            localStorage.setItem('dynamos_servers', JSON.stringify(SERVERS));
            closeModal('m-add-db');
            connect(url);
        }

        async function connect(url) {
            CURRENT_URL = url;
            try {
                const res = await fetch(url + '/.json');
                const data = await res.json();
                
                DB = data || {};
                if(!DB.dialog_config) DB.dialog_config = { title: "WolfTz", subtitle: "", admin_url: "" };
                if(!DB.keys) DB.keys = {};
                if(!DB.logs) DB.logs = { devices: {} };
                if(!DB.logs.devices) DB.logs.devices = {};
                
                document.getElementById('v-login').style.display = 'none';
                document.getElementById('main-app').style.display = 'block';
                document.getElementById('navbar').style.display = 'flex';
                refreshUI();
                startBackgroundSync();
            } catch(e) { alert("Connection failed. Check URL."); }
        }

        function startBackgroundSync() {
            if(autoSyncInterval) clearInterval(autoSyncInterval);
            autoSyncInterval = setInterval(async () => {
                try {
                    const res = await fetch(CURRENT_URL + '/.json');
                    const newData = await res.json();
                    if(!newData) return;

                    if(!newData.keys) newData.keys = {};
                    if(!newData.logs) newData.logs = { devices: {} };
                    if(!newData.logs.devices) newData.logs.devices = {};

                    checkNotifications(DB, newData);
                    DB = newData;

                    if(document.querySelectorAll('.modal-overlay.active').length === 0 && document.activeElement.tagName !== "INPUT") {
                        refreshUI(true);
                    }
                } catch(e) {}
            }, 8000);
        }

        function checkNotifications(oldDB, newDB) {
            Object.entries(newDB.keys).forEach(([key, data]) => {
                const oldData = oldDB.keys[key];
                if(oldData && !oldData.hwid && data.hwid) {
                    showToast(`🔐 Bounded: ${key.substring(0,10)}...`, "var(--primary)");
                }
            });

            Object.entries(newDB.logs.devices).forEach(([hwid, data]) => {
                const oldData = oldDB.logs.devices[hwid];
                if(!oldData && hwid !== 'SYSTEM') {
                    showToast(`📱 Login: ${data.device_model || 'Unknown'}`, "var(--success)");
                }
            });
        }

        async function manualReload() {
            const icon = document.getElementById('reload-icon');
            icon.style.transition = 'transform 0.5s ease';
            icon.style.transform = 'rotate(360deg)';
            
            try {
                const res = await fetch(CURRENT_URL + '/.json');
                const data = await res.json();
                DB = data || DB;
                refreshUI();
                showToast("Synced!", "var(--primary)");
            } catch(e) { showToast("Sync Failed!", "var(--danger)"); }
            
            setTimeout(() => { icon.style.transition = 'none'; icon.style.transform = 'rotate(0deg)'; }, 500);
        }

        function nav(id, el) {
            document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
            document.getElementById('v-' + id).classList.add('active');
            document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
            el.classList.add('active');
            if(id === 'logs') renderLogs();
        }

        function refreshUI(silent = false) {
            renderKeys();
            document.getElementById('st-total').innerText = Object.keys(DB.keys || {}).length;
            
            let deviceCount = Object.keys(DB.logs.devices || {}).filter(k => k !== 'SYSTEM').length;
            document.getElementById('st-live').innerText = deviceCount;
            
            if(!silent) {
                document.getElementById('cfg-title').value = DB.dialog_config.title || "";
                document.getElementById('cfg-subtitle').value = DB.dialog_config.subtitle || "";
                document.getElementById('cfg-url').value = DB.dialog_config.admin_url || "";
            }
        }

        /* Sleek Mode Render Keys */
        function renderKeys() {
            const list = document.getElementById('key-list');
            const search = document.getElementById('search').value.toLowerCase();
            const filter = document.getElementById('filter-type').value;
            list.innerHTML = '';

            let renderedCount = 0;

            Object.entries(DB.keys || {}).reverse().forEach(([id, data]) => {
                const isMatch = id.toLowerCase().includes(search);
                const type = checkStatus(data.expiry, data.hwid);

                if(!isMatch) return;
                if(filter !== 'all' && filter !== type) return;

                const isSelected = SELECTED.has(id);
                const card = document.createElement('div');
                card.className = `glass key-card ${isSelected ? 'selected' : ''}`;
                card.style.animationDelay = `${renderedCount * 0.03}s`;
                renderedCount++;
                
                let badgeClass = 'b-un';
                if(type === 'active') badgeClass = 'b-act';
                if(type === 'expired') badgeClass = 'b-exp';
                if(type === 'lifetime') badgeClass = 'b-life';

                card.innerHTML = `
                    <div class="key-card-top">
                        <div class="chk ${isSelected ? 'active' : ''}" onclick="toggleSelect('${id}', event)"><i class="fas fa-check"></i></div>
                        <div class="key-info-name" onclick="copyText('${id}', event)" title="Tap to copy">
                            <span class="key-name">${id}</span>
                            <i class="fas fa-copy" style="color: rgba(168,85,247,0.8); font-size: 0.75rem;"></i>
                        </div>
                        <span class="badge ${badgeClass}">${type}</span>
                    </div>
                    
                    <div class="key-card-bottom">
                        <div class="key-meta">
                            <span><i class="far fa-calendar-alt"></i> ${data.expiry === 'lifetime' ? 'LIFETIME' : data.expiry}</span>
                            <span onclick="copyText('${data.hwid}', event)" style="cursor: pointer;" title="Copy HWID">
                                <i class="fas fa-fingerprint"></i> ${data.hwid ? data.hwid.substring(0,9)+'...' : 'No Device Bound'}
                            </span>
                        </div>
                        <div class="key-actions">
                            <button class="k-btn k-warn" onclick="unbindSingle('${id}', event)" title="Unbind Device"><i class="fas fa-unlink"></i></button>
                            <button class="k-btn" onclick="editSingle('${id}', event)" title="Edit"><i class="fas fa-pen"></i></button>
                            <button class="k-btn k-del" onclick="deleteSingle('${id}', event)" title="Delete"><i class="fas fa-trash"></i></button>
                        </div>
                    </div>
                `;
                // Only card area outside buttons/text selects
                card.onclick = (e) => { if(e.target === card) toggleSelect(id); }; 
                list.appendChild(card);
            });
            updateActionButtons();
        }

        function renderLogs() {
            const list = document.getElementById('log-list');
            list.innerHTML = '';
            
            Object.entries(DB.logs.devices || {}).forEach(([hwid, log]) => {
                if(hwid === 'SYSTEM') return;
                
                const div = document.createElement('div');
                div.className = 'log-item glass';
                div.innerHTML = `
                    <div class="log-time"><i class="far fa-clock"></i> ${log.last_active || 'Unknown'}</div>
                    <div class="log-model">${log.device_model || 'Unknown Device'}</div>
                    <div style="font-size: 0.75rem; color: var(--text-dim); margin-top:2px;">Key: <span style="color:var(--primary); font-family:var(--font-code);">${log.active_key || 'None'}</span></div>
                    <div style="font-size: 0.65rem; color: #888; margin-top:2px;">HWID: ${hwid}</div>
                    <div class="log-status">${log.status || 'No Status'}</div>
                `;
                list.appendChild(div);
            });
        }

        // === ACTIONS ===
        function showToast(msg, bgColor = "var(--success)") {
            const toast = document.getElementById('toast');
            document.getElementById('toast-msg').innerHTML = msg;
            toast.style.background = bgColor.includes('var') ? bgColor : `rgba(${bgColor}, 0.7)`;
            toast.classList.add('show');
            setTimeout(() => { toast.classList.remove('show'); }, 2500);
        }

        function copyText(text, e) {
            e.stopPropagation(); 
            if(!text) return;
            navigator.clipboard.writeText(text).then(() => showToast("<i class='fas fa-check'></i> Copied!", "var(--primary)"));
        }

        function toggleSelect(id, e) {
            if(e) e.stopPropagation();
            if(SELECTED.has(id)) SELECTED.delete(id); else SELECTED.add(id);
            renderKeys();
        }

        function toggleSelectAll() {
            const keys = Object.keys(DB.keys || {});
            if(SELECTED.size === keys.length) SELECTED.clear();
            else keys.forEach(k => SELECTED.add(k));
            renderKeys();
        }

        function updateActionButtons() {
            const size = SELECTED.size;
            document.getElementById('count-e').innerText = size;
            document.getElementById('count-d').innerText = size;
            const btns = [document.getElementById('btn-edit'), document.getElementById('btn-del')];
            btns.forEach(b => size > 0 ? b.classList.remove('disabled') : b.classList.add('disabled'));
            document.getElementById('chk-all').className = `chk ${size > 0 && size === Object.keys(DB.keys || {}).length ? 'active' : ''}`;
        }

        async function sync() {
            await fetch(CURRENT_URL + '/.json', { method: 'PUT', body: JSON.stringify(DB) });
            refreshUI();
        }

        // --- Generator Functions ---
        function getExpiryValue(dateId, lifeId) {
            if(document.getElementById(lifeId).checked) return "lifetime";
            const d = document.getElementById(dateId).value;
            return formatDateToJSON(d) || "01/01/2099"; 
        }

        function generateBulk() {
            const amt = parseInt(document.getElementById('mb-amt').value);
            const pre = document.getElementById('mb-pre').value;
            const exp = getExpiryValue('mb-date', 'mb-life');
            
            for(let i=0; i<amt; i++) {
                const id = pre + Math.random().toString(36).substr(2, 6).toUpperCase();
                DB.keys[id] = { expiry: exp, hwid: "" };
            }
            sync(); closeModal('m-bulk-gen'); showToast(`Generated ${amt} keys`, "var(--primary)");
        }

        function openSingleModal() {
            document.getElementById('ms-key').value = 'STANY-VIP-' + Math.random().toString(36).substr(2, 6).toUpperCase();
            document.getElementById('ms-date').value = "";
            document.getElementById('ms-life').checked = false;
            toggleDateInput('ms-date', false);
            openModal('m-single-gen');
        }

        function generateSingle() {
            const id = document.getElementById('ms-key').value.trim();
            if(!id) return alert('Key required');
            if(DB.keys[id]) return alert('Exists');
            
            DB.keys[id] = { expiry: getExpiryValue('ms-date', 'ms-life'), hwid: "" };
            sync(); closeModal('m-single-gen'); showToast("Key Created", "var(--success)");
        }

        // --- Enhanced Edit Functions ---
        function openBulkEdit() {
            if(SELECTED.size === 0) return;
            EDIT_TARGET = null; 
            document.getElementById('edit-target-text').innerHTML = `<i class="fas fa-layer-group"></i> Editing <b>${SELECTED.size}</b> selected keys`;
            document.getElementById('edit-hwid-container').style.display = 'none'; // Hide HWID for bulk
            openModal('m-edit-key');
        }

        function editSingle(id, e) {
            e.stopPropagation();
            EDIT_TARGET = id;
            document.getElementById('edit-target-text').innerHTML = `Editing: <b style="color:var(--primary); font-family:var(--font-code);">${id}</b>`;
            
            // Expiry
            const isLife = DB.keys[id].expiry === 'lifetime';
            document.getElementById('me-life').checked = isLife;
            document.getElementById('me-date').value = formatDateToPicker(DB.keys[id].expiry);
            toggleDateInput('me-date', isLife);
            
            // HWID Binding Edit
            document.getElementById('edit-hwid-container').style.display = 'block';
            document.getElementById('me-hwid').value = DB.keys[id].hwid || "";

            openModal('m-edit-key');
        }

        function saveEdit() {
            const exp = getExpiryValue('me-date', 'me-life');
            
            if(EDIT_TARGET) {
                DB.keys[EDIT_TARGET].expiry = exp;
                DB.keys[EDIT_TARGET].hwid = document.getElementById('me-hwid').value.trim();
            } else {
                SELECTED.forEach(id => { DB.keys[id].expiry = exp; });
                SELECTED.clear();
            }
            sync(); closeModal('m-edit-key'); showToast("Changes Saved", "var(--primary)");
        }

        // --- Delete & Unbind Functions ---
        function deleteSelected() {
            if(!confirm(`Delete ${SELECTED.size} keys?`)) return;
            SELECTED.forEach(id => delete DB.keys[id]);
            SELECTED.clear(); sync(); showToast("Deleted", "var(--danger)");
        }

        function deleteSingle(id, e) {
            e.stopPropagation();
            if(!confirm(`Delete key: ${id}?`)) return;
            delete DB.keys[id];
            SELECTED.delete(id); sync(); showToast("Deleted", "var(--danger)");
        }

        function unbindSingle(id, e) {
            e.stopPropagation();
            if(!DB.keys[id].hwid) return showToast("Already Unbound", "var(--warning)");
            DB.keys[id].hwid = "";
            sync(); showToast("Unbound", "var(--success)");
        }

        // --- Config ---
        function saveConfig() {
            DB.dialog_config = {
                title: document.getElementById('cfg-title').value,
                subtitle: document.getElementById('cfg-subtitle').value,
                admin_url: document.getElementById('cfg-url').value
            };
            sync(); showToast("Settings Saved!", "var(--primary)");
        }

        function openModal(id) { document.getElementById(id).classList.add('active'); }
        function closeModal(id) { document.getElementById(id).classList.remove('active'); }
    </script>
</body>
</html>
